<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/carritoBase.css">
    <link rel="stylesheet" href="css/carritoLateral.css">
    <link rel="stylesheet" href="css/toolbar.css">
    <link rel="stylesheet" href="css/grillaProductos.css">
    <link rel="stylesheet" href="css/paginacion.css">
    <link rel="stylesheet" href="css/modal.css">
    <script type="module" src="js/app/app.js"></script>    
</head>
<body>

    <header>
        <div id="navbarComponente"></div>        
    </header>

    <main>
        <div class="toolbar">

                <div class="catalogo-info">
                    <p><span id="cantidadProductosEncontrados"></span> Productos</p>
                </div>
                <div class="catalogo-acciones">
                    <input id="buscador" placeholder="busca tu producto aquí" type="text">
                    <select id="ordenador">
                        <option value="">Ordenar por</option>
                        <option value="precioMayor">Precio: mayor a menor</option>
                        <option value="precioMenor">Precio: menor a mayor</option>
                        <option value="mejorEvaluado">Mejor evaluados</option>
                    </select>                    
                </div>

         </div>   

        <div class="container">
            <div id="grillaProductos"></div> 
            <div id="paginacion"></div>           
        </div>
    </main>

    <footer>
        <p>Creado por Andrés Orellana Vidal</p>
    </footer>

    <div id="contenedorCarritoLateral"></div>  
    
</body>
</html>
